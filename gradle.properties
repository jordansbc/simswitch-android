# If Gradle picks up a JRE rather than a JDK, point org.gradle.java.home at a JDK here
# (Android Studio's bundled JBR works). Left unset so it doesn't override your toolchain.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
